id: kandev-plugin-stl
api_version: 2
version: "0.1.1"
display_name: STL viewer
description: Rotate, zoom, and inspect the dimensions of STL models.
author: kdlbs
icon: icon.png
categories: [tools]
# Development floor only. Release is blocked until the host file-viewer API ships.
min_kandev_version: "0.103.0"
runtime:
  type: binary
  executables:
    linux-amd64: server/plugin-linux-amd64
    linux-arm64: server/plugin-linux-arm64
    darwin-amd64: server/plugin-darwin-amd64
    darwin-arm64: server/plugin-darwin-arm64
    windows-amd64: server/plugin-windows-amd64.exe
capabilities: {}
ui:
  bundle: /ui/index.js
  styles: [/ui/viewer.css]
  file_viewers:
    - id: stl
      title: STL viewer
      extensions: [stl]
